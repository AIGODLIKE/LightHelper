name = "Light Helper"
id = "LightHepler"
maintainer = "ACGGit"
version = "2.1.1"
tagline = "Manage light and world environment linking from the sidebar"
blender_version_min = "4.2.0"
type = "add-on"
schema_version = "1.0.0"
tags = ["Lighting"]
license = ["SPDX:GPL-3.0-or-later"]
support = "https://github.com/AIGODLIKE/LightHelper/issues"
website = "https://github.com/AIGODLIKE/LightHelper"

[permissions]
files = "Import and export user-selected .lhprofile profile files"

[build]
paths_exclude_pattern = [
    "__pycache__/",
    "/.git/",
    "/.github/",
    "/.idea/",
    "/.ruff_cache/",
    "/.pytest_cache/",
    "/tests/",
    "/.tmp/",
    "/qa/",
    "/artifacts/",
    "/dist/",
    "/AGENTS.md",
    "/PROJECT_CONTEXT.md",
    "/*.zip",
    "/.gitignore",
    "/README.md",
    "*.md",
    "**/*.pyc",
    "**/*.pyo",
    "**/*.log",
    "**/*.lhprofile",
    "**/*_qa.png",
    "**/*_qa.jpg",
]
